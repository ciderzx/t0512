<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>빛나는 구구단</title>
  <meta name="description" content="초등학생을 위한 화려하고 즐거운 구구단 학습 앱" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>빛나는 구구단</h1>
    <p>재미있게 구구단을 마스터해요! ✨</p>
  </header>

  <main class="container">
    <nav class="mode-toggle">
      <button id="learnModeBtn" class="active">학습하기</button>
      <button id="quizModeBtn">퀴즈풀기</button>
    </nav>

    <section class="selector">
      <h2 id="selectorTitle">단수를 선택하세요</h2>
      <div class="buttons" id="tableButtons"></div>
    </section>

    <section class="display-area" id="displayArea">
      <div class="grid" id="multiplicationGrid"></div>
      <!-- Quiz content will be injected here -->
    </section>

    <div id="scoreBoard" class="score" style="display: none;">
      맞힌 개수: <span id="correctCount">0</span> / <span id="totalCount">0</span>
    </div>
  </main>

  <footer>
    <p>© 2026 빛나는 구구단 · 즐거운 수학 여행</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.7.0/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
